name: Produce Bobo Cartoon Episode

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الحلقة الجديدة لبوبو'
        required: true
        default: 'بوبو يتعلم مشاركة الألعاب مع كوكو'

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Arabic Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install -r requirements.txt

      - name: Run Cartoon Production Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic || 'مغامرة بوبو مع الأرقام من 1 إلى 5' }}
        run: python generate.py

      - name: Upload Final Cartoon Episode
        uses: actions/upload-artifact@v4
        with:
          name: bobo-cartoon-ready
          path: output/
