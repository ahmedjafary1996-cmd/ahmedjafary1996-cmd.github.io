name: Produce Bobo Cartoon Episode
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Episode Topic'
        required: true
        default: 'بوبو يتعلم مشاركة الألعاب مع كوكو'
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
        run: python generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: bobo-cartoon-ready
          path: output/
